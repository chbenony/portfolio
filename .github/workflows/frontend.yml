name: Frontend checks

on:
    pull_request:

permissions:
    contents: read

concurrency:
    group: frontend-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    checks:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v7
              with:
                node-version: "24"
                cache: npm
                cache-dependency-path: frontend/package-lock.json
            
            - run: npm ci
            - run: npm run lint
            - run: npm run build